name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Rendre gradlew exécutable
        run: chmod +x gradlew || chmod +x app/gradlew || true

      - name: Compiler l'APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease || ./gradlew assembleDebug
          else
            cd app && (./gradlew assembleRelease || ./gradlew assembleDebug)
          fi

      - name: Créer la GitHub Release et attacher l'APK
        uses: softprops/action-gh-release@v2
        with:
          files: "**/build/outputs/apk/**/*.apk"
          generate_release_notes: true
