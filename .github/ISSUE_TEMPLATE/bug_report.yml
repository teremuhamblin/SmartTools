name: 🐛 Signalement de Bug
description: Signaler un dysfonctionnement dans SmartTools
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce problème pour améliorer SmartTools !
  - type: input
    id: device
    attributes:
      label: Modèle du smartphone
      description: Ex: Samsung Galaxy S23 Ultra, Galaxy A54, etc.
      placeholder: Galaxy S...
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: Version d'Android & One UI
      description: Ex: Android 14 / One UI 6.1
      placeholder: Android 14
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description du bug
      description: Que s'est-il passé ?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      description: 1. Aller sur l'écran... / 2. Cliquer sur...
      placeholder: |
        1. Ouvrir SmartTools
        2. Cliquer sur 'OptimizationScreen'
        3. Constater l'erreur...
    validations:
      required: true
