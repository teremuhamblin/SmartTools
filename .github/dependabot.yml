version: 2
updates:
  # -------------------------------------------------------------
  # 1. Dépendances Android / Kotlin dans le sous-dossier /app
  # -------------------------------------------------------------
  - package-ecosystem: "gradle"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    groups:
      # Regroupe les bibliothèques AndroidX et Google dans une seule PR
      android-core:
        patterns:
          - "androidx.*"
          - "com.google.android.*"
      # Regroupe les montées de versions mineures et correctifs (patchs)
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # -------------------------------------------------------------
  # 2. Workflows CI/CD GitHub Actions (toujours à la racine)
  # -------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5
