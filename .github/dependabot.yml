version: 2
updates:
  # ---------------------------------------------------------------------------
  # 1. Dépendances Android / Kotlin (Gradle dans le sous-dossier /app)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "gradle"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(android)"
    assignees:
      - "teremuhamblin"
    labels:
      - "dependencies"
      - "android"
    
    # Bloque les montées majeures (ex: v1.x -> v2.x) pour préserver la stabilité de la v1.0.0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

    # Regroupe les PRs pour éviter d'être spammé
    groups:
      android-core:
        patterns:
          - "androidx.*"
          - "com.google.android.*"
      compose-ui:
        patterns:
          - "androidx.compose.*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # 2. GitHub Actions (Workflows CI/CD à la racine)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    assignees:
      - "teremuhamblin"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        patterns:
          - "*"
